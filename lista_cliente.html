<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop | Clientes</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base/base.css">

<body>
    <header class="cabecalho container">
        <img src="./img/logo_pet.png" alt="logo">
        <nav>
            <ul class="cabecalho__lista-navegacao">
                <li class="cabecalho__link"><a href="./index.html">Dashboard</a></li>

                        <th class="tabela__coluna--m">Email</th>
                        <th class="tabela__coluna--p">CPF</th>

                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Ana Beatriz Souza</td>

                        <td class="tabela__alinhamento--direita">
                            <ul class="tabela__botoes-controle">
                                <li><button class="botao-simples botao-simples--editar">Editar</button></li>
                                <li><button class="botao-simples botao-simples--excluir">Excluir</button></li>
                            </ul>
                        </td>
                    </tr>
                    <tr>
                        <td>Carlos Eduardo Lima</td>

                        <td>987.654.321-00</td>

                            <ul class="tabela__botoes-controle">
                                <li><button class="botao-simples botao-simples--editar">Editar</button></li>
                                <li><button class="botao-simples botao-simples--excluir">Excluir</button></li>

                    <tr>
                        <td>Marina Torres</td>

                            <ul class="tabela__botoes-controle">
                                <li><button class="botao-simples botao-simples--editar">Editar</button></li>
                                <li><button class="botao-simples botao-simples--excluir">Excluir</button></li>
                            </ul>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>

</html>
